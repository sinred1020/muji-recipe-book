const catsByCity={"비엔나":["전체","음식점","간식","펍·바","카페","관광지"],"프라하":["전체","음식점","간식","카페","펍·바","시장","기념품","관광지","야경·전망"],"체스키크룸로프":["전체","음식점","여행 팁"]};
let city="비엔나",category="전체",view="all";
const $=id=>document.getElementById(id);
const mapsUrl=p=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+" "+p.address);
const escapeHtml=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getFavs(){try{return JSON.parse(localStorage.getItem("travelFavs")||"[]")}catch(e){return []}}
function setFavs(a){localStorage.setItem("travelFavs",JSON.stringify(a))}
function renderFilters(){ $("filters").innerHTML=catsByCity[city].map(c=>'<button class="chip '+(c===category?'active':'')+'" data-cat="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>').join("");}
function render(){
 const q=$("search").value.trim().toLowerCase(), favs=getFavs();
 const rows=places.filter(p=>p.city===city&&(category==="전체"||p.cat===category)&&(view!=="favorites"||favs.includes(p.name))&&(view!=="visited"||p.visited)&&(!q||(p.name+" "+p.note+" "+(p.menu||"")+" "+p.status+" "+p.cat).toLowerCase().includes(q)));
 $("listTitle").textContent=(view==="favorites"?"찜한 곳":view==="visited"?"가본 곳":city+" 추천 장소");
 $("count").textContent=rows.length+"곳";
 $("cards").innerHTML=rows.length?rows.map(p=>'<article class="card"><div class="card-top"><div class="emoji">'+p.emoji+'</div><div style="flex:1;min-width:0"><h3>'+escapeHtml(p.name)+'</h3><div class="sub">'+escapeHtml(p.cat)+' · '+escapeHtml(p.address)+'</div></div></div><div class="tags">'+(p.star?'<span class="tag star">⭐ 추천</span>':'')+(p.visited?'<span class="tag visited">☑ 가본 곳</span>':'')+'<span class="tag">'+escapeHtml(p.status||"저장한 장소")+'</span></div><div class="note">'+escapeHtml(p.note)+'</div>'+(p.menu?'<div class="meta"><strong>추천 메뉴</strong> · '+escapeHtml(p.menu)+'</div>':'')+((p.hours||p.closed)?'<div class="meta"><strong>영업시간</strong> · '+escapeHtml(p.hours||"최신 시간 지도에서 확인")+'<br><strong>휴무</strong> · '+escapeHtml(p.closed||"방문일 기준 지도·공식 사이트 확인")+'</div>':'<div class="meta"><strong>영업시간·휴무</strong> · 방문일 기준 Google Maps에서 확인</div>')+(p.booking?'<div class="booking-note"><strong>🍽️ 예약 팁</strong> · '+escapeHtml(p.booking)+'</div>':'')+(p.ticketNote?'<div class="ticket-note"><strong>🎟️ 입장권 팁</strong> · '+escapeHtml(p.ticketNote)+'</div>':'')+'<div class="actions"><a class="map" href="'+mapsUrl(p)+'" target="_blank" rel="noopener">📍 구글맵 위치</a><a href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.name+" "+p.address)+'" target="_blank" rel="noopener">🚶 길찾기</a>'+(p.url?'<a href="'+p.url+'" target="_blank" rel="noopener">🌐 공식 사이트</a>':'')+(p.reserveUrl?'<a class="reserve" href="'+p.reserveUrl+'" target="_blank" rel="noopener">🍽️ 예약 확인</a>':'')+(p.ticketUrl?'<a class="ticket" href="'+p.ticketUrl+'" target="_blank" rel="noopener">🎟️ 입장권·운영정보</a>':'')+'<button class="fav '+(favs.includes(p.name)?'active':'')+'" data-fav="'+escapeHtml(p.name)+'">'+(favs.includes(p.name)?'♥ 찜 완료':'♡ 찜하기')+'</button></div></article>').join(""):'<div class="empty">조건에 맞는 장소가 없어요 🧭<br>다른 검색어나 카테고리를 선택해 봐요.</div>';
}
document.querySelectorAll("[data-city]").forEach(b=>b.addEventListener("click",()=>{city=b.dataset.city;category="전체";view="all";document.querySelectorAll("[data-city]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view==="all"));renderFilters();render()}));
$("filters").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;category=b.dataset.cat;renderFilters();render()});
$("search").addEventListener("input",render);
$("cards").addEventListener("click",e=>{const b=e.target.closest("[data-fav]");if(!b)return;let a=getFavs();const n=b.dataset.fav;a=a.includes(n)?a.filter(x=>x!==n):a.concat(n);setFavs(a);render()});
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x===b));render()}));
renderFilters();render();
</script>
